%% 沙箱镜像的 ctex 默认选项，装到 TEXMFLOCAL。ctex 在处理文档类选项之前读这个文件（ctex.sty 里的 \ctex_file_input:n { ctexopts.cfg }），
%% 读入时是普通 LaTeX 语法（2026-10-18 实测：直接写 expl3 命令报 Undefined control sequence），所以用 \ExplSyntaxOn 包起来。
%% 这里设的是默认值，文档自己写 fontset=... 时以文档为准。
%% 默认字库改成镜像里的思源宋体、思源黑体、文鼎楷体、朱雀仿宋，见 ctex-fontset-easos.def。
\ExplSyntaxOn
\keys_set:nn { ctex / option } { fontset = easos }
\ExplSyntaxOff
