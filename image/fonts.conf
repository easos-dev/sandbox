<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  沙箱镜像的字体映射，装到 /etc/fonts/local.conf。
  目的：Windows / macOS 生成的 docx、xlsx、pptx 写的是宋体、微软雅黑、ＭＳ 明朝这类本机没有的字体名，
  LibreOffice 转 PDF、渲染时按这里换成镜像里字形与用途最接近的字体，而不是随便回退。
  Arial / Times New Roman / Courier New / Calibri / Cambria 不在这里：fontconfig 自带的 30-metric-aliases.conf
  已经把它们映射到度量兼容的 Liberation、Carlito、Caladea（排版不跑行）。
  每个名字单独一个 alias，不用一个 alias 里列多个 family 的写法，兼容所有 fontconfig 版本。
  没指定语言的汉字默认用简体中文字形（Noto CJK SC）；文档或程序指定了 ja / zh-tw / ko 时，
  fonts-noto-cjk 自带的规则会换成对应地区的字形。
-->
<fontconfig>
  <!-- 通用族：西文先用 Noto / DejaVu，汉字落到 Noto CJK SC，最后是彩色 Emoji。 -->
  <alias><family>sans-serif</family><prefer><family>Noto Sans</family><family>DejaVu Sans</family><family>Noto Sans CJK SC</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Noto Serif</family><family>DejaVu Serif</family><family>Noto Serif CJK SC</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>DejaVu Sans Mono</family><family>Noto Sans Mono CJK SC</family><family>Noto Color Emoji</family></prefer></alias>

  <!-- 简体中文：宋体类 → 思源宋体（Noto Serif CJK SC） -->
  <alias binding="same"><family>SimSun</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>宋体</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>NSimSun</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>新宋体</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>STSong</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>华文宋体</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>Songti SC</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>Source Han Serif SC</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>思源宋体</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>

  <!-- 简体中文：黑体类 → 思源黑体（Noto Sans CJK SC） -->
